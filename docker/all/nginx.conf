# Mimir single-container SPA hosting. The api lives on :4000 (exposed
# separately); the browser talks to it cross-origin, which the api allows for
# WEB_APP_URL (default http://localhost). No API proxying here.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}