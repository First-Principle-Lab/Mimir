name: ci

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev] # staging and main pushes run CI through deploy.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"
  TURBO_TELEMETRY_DISABLED: "1"
  # Tests and eval scripts expect these exact ports (see AGENTS.md).
  DATABASE_URL: postgres://mimir:mimir@localhost:5434/mimir
  REDIS_URL: redis://localhost:6380
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else

jobs:
  promotion:
    name: promotion direction
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev -> staging -> main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            staging)
              [ "$HEAD" = "dev" ] || { echo "::error::PRs into staging must come from dev (got '$HEAD')."; exit 1; } ;;
            main)
              [ "$HEAD" = "staging" ] || [[ "$HEAD" == hotfix/* ]] || { echo "::error::PRs into main (production) must come from staging or hotfix/* (got '$HEAD')."; exit 1; } ;;
            dev)
              [[ "$HEAD" != eval/* ]] || { echo "::error::eval/* branches are records and are never merged."; exit 1; } ;;
          esac
          echo "ok: $HEAD -> $BASE"

  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mimir" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Migrate
        run: bun run migrate
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        # No OPENROUTER_API_KEY here on purpose: real-LLM tests skip themselves.
        run: bun run test
      - name: Single backend-core copy
        run: bun run verify
      - name: Build
        # The Tauri desktop build needs a Rust toolchain and is built separately.
        run: bunx turbo run build --filter='!@mimir/desktop'

  memory-gate:
    name: memory retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mimir" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::OPENROUTER_API_KEY secret is not set; memory retrieval gate skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.run == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        if: steps.key.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Migrate
        if: steps.key.outputs.run == 'true'
        run: bun run migrate
      - name: Retrieval gate (fails under 90% recall)
        if: steps.key.outputs.run == 'true'
        env:
          CI: "true"
        run: bun run eval-retrieval

  harness-gate:
    name: read-only harness scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mimir" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::OPENROUTER_API_KEY is not set; live harness scenarios skipped (scripted tests still run)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.run == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        if: steps.key.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Migrate
        if: steps.key.outputs.run == 'true'
        run: bun run migrate
      - name: Evaluate HTTP intake, queued inference, persistence and sockets
        if: steps.key.outputs.run == 'true'
        env:
          CI: "true"
        run: bun run eval-harness

  docker:
    name: docker image (${{ matrix.app }})
    # Image builds are slow; run them on the way to staging and main (production) only.
    if: >-
      (github.event_name == 'pull_request' && contains(fromJSON('["staging","main"]'), github.base_ref)) ||
      (github.event_name == 'push' && contains(fromJSON('["staging","main"]'), github.ref_name))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
