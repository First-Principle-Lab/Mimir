name: eval

# Each run is published to its own eval/<date>-<suite>-<topic> branch (see evals/README.md).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite
        type: choice
        options: [retrieval, query, locomo, harness, memory]
        default: retrieval
      topic:
        description: What this eval run is about
        required: true
      ref:
        description: Branch, tag or commit to evaluate
        default: dev
  schedule:
    - cron: "0 5 * * *" # nightly: every suite against dev

permissions:
  contents: write # push eval/* branches

jobs:
  eval:
    name: eval ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ github.event_name == 'schedule' && fromJSON('["retrieval","query","locomo","harness","memory"]') || fromJSON(format('["{0}"]', inputs.suite)) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mimir" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://mimir:mimir@localhost:5434/mimir
      REDIS_URL: redis://localhost:6380
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CI: "true"
      JWT_SECRET: eval-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'dev' }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Migrate
        run: bun run migrate
      - name: Run and publish
        id: run
        env:
          SUITE: ${{ matrix.suite }}
          TOPIC: ${{ inputs.topic || 'nightly' }}
          EVAL_SOURCE_REF: ${{ inputs.ref || 'dev' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/eval/run.sh "$SUITE" "$TOPIC" --push
      - name: Summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          BRANCH: ${{ steps.run.outputs.eval_branch }}
          STATUS: ${{ steps.run.outputs.eval_status }}
        run: |
          {
            echo "### Eval $SUITE: ${STATUS:-not published}"
            [ -n "$BRANCH" ] && echo "Results: [\`$BRANCH\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${BRANCH}/evals/runs)"
          } >> "$GITHUB_STEP_SUMMARY"
